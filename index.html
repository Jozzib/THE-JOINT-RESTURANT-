<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Joint - Fresh Food & Drinks Delivered</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Paystack Popup JS -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- TOP NAVIGATION BAR -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40 transition-all">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="#" class="flex items-center gap-3 group">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 text-white flex items-center justify-center font-bold text-xl shadow-lg shadow-orange-500/30 group-hover:scale-105 transition">
          <i class="fa-solid fa-fire-flame-curved"></i>
        </div>
        <div>
          <span class="text-xl font-black text-slate-900 tracking-tight block leading-tight">The Joint</span>
          <span class="inline-flex items-center gap-1.5 text-[11px] font-bold text-emerald-600">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Open for orders
          </span>
        </div>
      </a>

      <!-- Public Cart Button Only -->
      <button onclick="toggleCart(true)" class="relative bg-slate-900 hover:bg-orange-600 text-white px-5 py-2.5 rounded-2xl font-bold text-xs shadow-lg shadow-slate-900/10 hover:shadow-orange-500/20 transition flex items-center gap-2.5 group">
        <i class="fa-solid fa-bag-shopping text-orange-400 group-hover:text-white transition"></i>
        <span>My Order</span>
        <span id="cart-badge" class="bg-orange-500 text-white text-[11px] font-extrabold px-2 py-0.5 rounded-full min-w-[20px] text-center">0</span>
      </button>

    </div>
  </header>

  <!-- HERO BANNER -->
  <section class="relative bg-slate-900 text-white py-14 sm:py-20 px-4 sm:px-6 overflow-hidden">
    <div class="absolute inset-0 z-0 opacity-30 mix-blend-overlay">
      <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=1600&q=80" alt="Restaurant background" class="w-full h-full object-cover" />
    </div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent z-0"></div>

    <div class="max-w-7xl mx-auto relative z-10 flex flex-col md:flex-row items-center justify-between gap-8">
      <div class="max-w-2xl text-center md:text-left">
        <span class="inline-block px-3.5 py-1.5 rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30 text-xs font-extrabold uppercase tracking-wider mb-4">
          🔥 Freshly Made Daily
        </span>
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight leading-tight mb-3">
          Delicious Food, <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-300">Delivered Fast</span>
        </h1>
        <p class="text-slate-300 text-sm sm:text-base max-w-lg mb-6 leading-relaxed">
          Select your portion size, customize extra swallows, and check out securely in seconds!
        </p>
      </div>
    </div>
  </section>

  <!-- MENU EXPLORER SECTION -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 py-10">
    
    <!-- CONTROLS HEADER -->
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8 pb-6 border-b border-slate-200">
      <div class="flex gap-2 w-full md:w-auto bg-slate-200/80 p-1.5 rounded-2xl overflow-x-auto">
        <button onclick="setCategory('all')" id="tab-all" class="tab-btn px-6 py-2.5 rounded-xl text-xs font-bold transition bg-white text-slate-900 shadow-sm whitespace-nowrap">All Items</button>
        <button onclick="setCategory('food')" id="tab-food" class="tab-btn px-6 py-2.5 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900 whitespace-nowrap">Foods 🍲</button>
        <button onclick="setCategory('drink')" id="tab-drink" class="tab-btn px-6 py-2.5 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900 whitespace-nowrap">Drinks 🍹</button>
      </div>

      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" onkeyup="renderMenu()" placeholder="Search dishes or drinks..." 
               class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none shadow-xs transition" />
      </div>
    </div>

    <!-- FOOD GRID -->
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-20 bg-white rounded-3xl border border-slate-200/80">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-orange-500"></i>
        <p class="text-sm font-semibold text-slate-600">Loading menu...</p>
      </div>
    </div>

  </main>

  <!-- ITEM CUSTOMIZATION MODAL -->
  <div id="customize-modal" class="fixed inset-0 z-50 pointer-events-none transition-opacity duration-200 opacity-0 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs" onclick="closeModal()"></div>
    
    <div class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden pointer-events-auto transform transition-transform duration-200 scale-95" id="modal-box">
      <!-- Modal Header -->
      <div class="relative h-40 bg-slate-100">
        <img id="modal-img" src="" alt="Dish" class="w-full h-full object-cover" />
        <button onclick="closeModal()" class="absolute top-3 right-3 bg-slate-900/70 hover:bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center text-sm transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-6 space-y-5 max-h-[70vh] overflow-y-auto">
        <div>
          <h2 id="modal-title" class="text-xl font-black text-slate-900">Item Name</h2>
          <p id="modal-base-price" class="text-orange-600 font-extrabold text-lg">₦0</p>
        </div>

        <!-- Portion Selector -->
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Number of Portions</label>
          <div class="flex items-center gap-3">
            <button onclick="adjustModalQty(-1)" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-800 text-lg flex items-center justify-center">-</button>
            <span id="modal-qty" class="font-extrabold text-lg text-slate-900 min-w-[20px] text-center">1</span>
            <button onclick="adjustModalQty(1)" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 font-bold text-slate-800 text-lg flex items-center justify-center">+</button>
          </div>
        </div>

        <!-- Swallow Options -->
        <div id="swallow-section" class="border-t border-slate-100 pt-4 space-y-3">
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="extra-swallow-check" onchange="toggleSwallowOptions()" class="w-4 h-4 rounded text-orange-500 focus:ring-orange-400" />
              <span class="text-xs font-extrabold text-slate-800 uppercase">Add Extra Swallow (+₦500)</span>
            </label>
          </div>

          <div id="swallow-select-box" class="hidden space-y-2 pl-6">
            <label class="block text-xs font-semibold text-slate-500">Choose Swallow Type:</label>
            <select id="swallow-type" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl text-sm bg-white font-medium focus:ring-2 focus:ring-orange-500 focus:outline-none">
              <option value="Eba (Garri)">Eba (Garri)</option>
              <option value="Semo">Semo</option>
              <option value="Pounded Yam">Pounded Yam (+₦300 extra)</option>
              <option value="Amala">Amala</option>
              <option value="Wheat">Wheat</option>
              <option value="Fufu">Fufu</option>
            </select>
          </div>
        </div>

        <!-- Special Request Note -->
        <div class="border-t border-slate-100 pt-4">
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Special Instructions (Optional)</label>
          <input type="text" id="modal-note" placeholder="e.g. Extra pepper, no onions, warm soup..." 
                 class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-orange-500 focus:outline-none" />
        </div>
      </div>

      <!-- Modal Footer Add Button -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between gap-4">
        <div>
          <span class="text-[10px] font-bold text-slate-400 uppercase block">Total Price</span>
          <span id="modal-calculated-total" class="font-black text-slate-900 text-lg">₦0</span>
        </div>
        <button onclick="confirmAddToCart()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-xl font-bold text-xs shadow-md transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> Add to Order
        </button>
      </div>

    </div>
  </div>

  <!-- SLIDE-OUT CART DRAWER -->
  <div id="cart-drawer" class="fixed inset-0 z-50 pointer-events-none transition-opacity duration-300 opacity-0">
    <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs transition-opacity" onclick="toggleCart(false)"></div>
    
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col pointer-events-auto transform transition-transform duration-300 translate-x-full" id="drawer-panel">
      
      <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-sm">
            <i class="fa-solid fa-bag-shopping"></i>
          </div>
          <h2 class="font-extrabold text-slate-900 text-base">Your Order Cart</h2>
        </div>
        <button onclick="toggleCart(false)" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-200/60 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4">
        <p class="text-center text-slate-400 text-sm py-12">Your cart is empty.</p>
      </div>

      <div class="p-5 border-t border-slate-100 bg-slate-50/80 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Delivery Email</label>
          <input type="email" id="customer-email" placeholder="your-email@example.com" required
                 class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm bg-white" />
        </div>

        <div class="flex justify-between items-center text-sm pt-2">
          <span class="text-slate-500 font-semibold">Total Payable</span>
          <span id="cart-total" class="font-black text-slate-900 text-xl">₦0</span>
        </div>

        <button id="checkout-btn" onclick="initiateCheckout()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-orange-500/25 transition flex items-center justify-center gap-2 text-sm">
          <i class="fa-solid fa-lock"></i> Proceed to Payment
        </button>
      </div>

    </div>
  </div>

  <script>
    // ⬇️ REPLACE THIS WITH YOUR REAL SUPABASE ANON KEY ⬇️
    const SUPABASE_URL = "https://vgznxqrcnofihvknkmfz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnem54cXJjbm9maWh2a25rbWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDAyODcsImV4cCI6MjEwMTExNjI4N30.xHB1roeWOuyH5L57C-hn-BDspr0X1I6HFsH_ulURWVo"; 

    let supabase = null;
    if (SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY") {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let allMenuItems = [];
    let activeCategory = 'all';
    let cart = [];

    let selectedItem = null;
    let modalQty = 1;

    async function loadMenu() {
      const grid = document.getElementById('menu-grid');
      
      // KEY CHECK FAILSAFE
      if (!supabase) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-amber-50 border border-amber-200 text-amber-900 rounded-3xl p-6">
            <i class="fa-solid fa-key text-3xl text-amber-500 mb-2"></i>
            <p class="font-bold text-base">Supabase Key Required</p>
            <p class="text-xs text-amber-700 mt-1 max-w-md mx-auto">
              Please edit <strong>index.html</strong> and replace <code>YOUR_SUPABASE_ANON_KEY</code> on line 185 with your actual key from Supabase Dashboard!
            </p>
          </div>`;
        return;
      }

      try {
        const { data, error } = await supabase
          .from('menu_items')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        allMenuItems = data || [];

        if (allMenuItems.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-dashed border-slate-200 p-6">
              <i class="fa-solid fa-utensils text-4xl text-slate-300 mb-3"></i>
              <h3 class="font-bold text-slate-800 text-base">No Menu Items Found</h3>
              <p class="text-slate-500 text-xs mt-1">Please add food and drinks using your admin portal.</p>
            </div>`;
          return;
        }

        renderMenu();
      } catch (err) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 bg-rose-50 border border-rose-200 text-rose-700 rounded-3xl p-6">
            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
            <p class="font-bold text-sm">Database Error</p>
            <p class="text-xs mt-1 text-rose-600">${err.message}</p>
          </div>`;
      }
    }

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();

      const itemsToDisplay = allMenuItems.filter(item => {
        const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (itemsToDisplay.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">No dishes match your search.</div>`;
        return;
      }

      grid.innerHTML = itemsToDisplay.map(item => `
        <div class="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-xs hover:shadow-xl hover:-translate-y-1 transition duration-300 flex flex-col group ${!item.is_available ? 'opacity-65' : ''}">
          
          <div class="h-48 w-full bg-slate-100 relative overflow-hidden">
            <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'}" 
                 alt="${item.name}" 
                 class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
            
            <span class="absolute top-3.5 right-3.5 text-[10px] font-black uppercase tracking-wider px-3 py-1 rounded-full ${item.category === 'drink' ? 'bg-pink-500 text-white' : 'bg-slate-900 text-white'} shadow-md">
              ${item.category}
            </span>

            ${!item.is_available ? `
              <div class="absolute inset-0 bg-slate-950/50 backdrop-blur-xs flex items-center justify-center">
                <span class="bg-rose-600 text-white text-xs font-black uppercase tracking-wider px-3 py-1.5 rounded-full shadow-lg">Sold Out</span>
              </div>
            ` : ''}
          </div>

          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-extrabold text-slate-900 text-base mb-1 group-hover:text-orange-500 transition">${item.name}</h3>
              <p class="text-orange-600 font-black text-xl">₦${Number(item.price).toLocaleString()}</p>
            </div>

            <div class="mt-5">
              ${item.is_available ? `
                <button onclick="openCustomizeModal(${item.id})" class="w-full bg-slate-100 hover:bg-orange-500 hover:text-white text-slate-900 py-3 rounded-2xl font-bold text-xs transition flex items-center justify-center gap-2 group-hover:shadow-md">
                  <i class="fa-solid fa-sliders text-orange-500 group-hover:text-white transition"></i> Customize & Add
                </button>
              ` : `
                <button disabled class="w-full bg-slate-100 text-slate-400 py-3 rounded-2xl font-bold text-xs cursor-not-allowed">
                  Currently Unavailable
                </button>
              `}
            </div>
          </div>

        </div>
      `).join('');
    }

    function openCustomizeModal(id) {
      selectedItem = allMenuItems.find(i => i.id === id);
      if (!selectedItem) return;

      modalQty = 1;
      document.getElementById('modal-title').innerText = selectedItem.name;
      document.getElementById('modal-base-price').innerText = `₦${Number(selectedItem.price).toLocaleString()}`;
      document.getElementById('modal-img').src = selectedItem.image_url || 'https://via.placeholder.com/300';
      document.getElementById('modal-qty').innerText = modalQty;
      document.getElementById('extra-swallow-check').checked = false;
      document.getElementById('swallow-select-box').classList.add('hidden');
      document.getElementById('modal-note').value = '';

      const swallowSec = document.getElementById('swallow-section');
      if (selectedItem.category === 'drink') swallowSec.classList.add('hidden');
      else swallowSec.classList.remove('hidden');

      recalculateModalPrice();

      const modal = document.getElementById('customize-modal');
      const box = document.getElementById('modal-box');
      modal.classList.remove('pointer-events-none', 'opacity-0');
      box.classList.remove('scale-95');
    }

    function closeModal() {
      const modal = document.getElementById('customize-modal');
      const box = document.getElementById('modal-box');
      modal.classList.add('pointer-events-none', 'opacity-0');
      box.classList.add('scale-95');
    }

    function adjustModalQty(change) {
      if (modalQty + change >= 1) {
        modalQty += change;
        document.getElementById('modal-qty').innerText = modalQty;
        recalculateModalPrice();
      }
    }

    function toggleSwallowOptions() {
      const checked = document.getElementById('extra-swallow-check').checked;
      const box = document.getElementById('swallow-select-box');
      if (checked) box.classList.remove('hidden');
      else box.classList.add('hidden');
      recalculateModalPrice();
    }

    function recalculateModalPrice() {
      if (!selectedItem) return;
      
      let pricePerPortion = Number(selectedItem.price);
      const isSwallowChecked = document.getElementById('extra-swallow-check').checked;
      
      if (isSwallowChecked) {
        pricePerPortion += 500;
        const swallowType = document.getElementById('swallow-type').value;
        if (swallowType.includes("Pounded Yam")) pricePerPortion += 300;
      }

      const total = pricePerPortion * modalQty;
      document.getElementById('modal-calculated-total').innerText = `₦${total.toLocaleString()}`;
    }

    document.getElementById('swallow-type').addEventListener('change', recalculateModalPrice);

    function confirmAddToCart() {
      if (!selectedItem) return;

      const isSwallowChecked = document.getElementById('extra-swallow-check').checked;
      const swallowType = document.getElementById('swallow-type').value;
      const note = document.getElementById('modal-note').value;

      let extraPrice = 0;
      let swallowInfo = "";

      if (isSwallowChecked && selectedItem.category !== 'drink') {
        extraPrice += 500;
        if (swallowType.includes("Pounded Yam")) extraPrice += 300;
        swallowInfo = `Extra ${swallowType}`;
      }

      const finalUnitPrice = Number(selectedItem.price) + extraPrice;
      const itemTitle = `${selectedItem.name}${swallowInfo ? ` (+ ${swallowInfo})` : ''}${note ? ` [Note: ${note}]` : ''}`;

      cart.push({
        id: Date.now(),
        originalId: selectedItem.id,
        name: itemTitle,
        price: finalUnitPrice,
        quantity: modalQty
      });

      closeModal();
      updateCartUi();
      toggleCart(true);
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn px-6 py-2.5 rounded-xl text-xs font-bold transition text-slate-600 hover:text-slate-900 whitespace-nowrap";
      });
      document.getElementById(`tab-${cat}`).className = "tab-btn px-6 py-2.5 rounded-xl text-xs font-bold transition bg-white text-slate-900 shadow-sm whitespace-nowrap";
      renderMenu();
    }

    function updateQuantity(cartId, change) {
      const index = cart.findIndex(c => c.id === cartId);
      if (index > -1) {
        cart[index].quantity += change;
        if (cart[index].quantity <= 0) cart.splice(index, 1);
      }
      updateCartUi();
    }

    function updateCartUi() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartBadge = document.getElementById('cart-badge');
      const cartTotal = document.getElementById('cart-total');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartBadge.innerText = totalItems;
      cartTotal.innerText = `₦${totalPrice.toLocaleString()}`;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-12">Your cart is empty.</p>`;
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between gap-3 p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
          <div class="min-w-0 flex-1">
            <h4 class="font-bold text-slate-800 text-xs leading-snug">${item.name}</h4>
            <p class="text-orange-600 font-extrabold text-xs mt-0.5">₦${Number(item.price).toLocaleString()} / portion</p>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <button onclick="updateQuantity(${item.id}, -1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-700 hover:bg-slate-100">-</button>
            <span class="text-xs font-black text-slate-800 w-4 text-center">${item.quantity}</span>
            <button onclick="updateQuantity(${item.id}, 1)" class="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-700 hover:bg-slate-100">+</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart(open) {
      const drawer = document.getElementById('cart-drawer');
      const panel = document.getElementById('drawer-panel');

      if (open) {
        drawer.classList.remove('pointer-events-none', 'opacity-0');
        panel.classList.remove('translate-x-full');
      } else {
        drawer.classList.add('pointer-events-none', 'opacity-0');
        panel.classList.add('translate-x-full');
      }
    }

    async function initiateCheckout() {
      const email = document.getElementById('customer-email').value;
      if (!email) return alert("Please enter your email address.");
      if (cart.length === 0) return alert("Your cart is empty!");

      const checkoutBtn = document.getElementById('checkout-btn');
      checkoutBtn.disabled = true;
      checkoutBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      try {
        const response = await fetch('/.netlify/functions/create-paystack-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, amount: totalAmount, cart })
        });

        const data = await response.json();
        if (data.authorization_url) {
          window.location.href = data.authorization_url;
        } else if (data.access_code) {
          const handler = PaystackPop.setup({
            key: data.public_key,
            email: email,
            amount: totalAmount * 100,
            ref: data.reference,
            callback: function(res) {
              alert('Payment complete! Reference: ' + res.reference);
              cart = [];
              updateCartUi();
              toggleCart(false);
            }
          });
          handler.openIframe();
        } else {
          throw new Error(data.error || "Checkout failed");
        }
      } catch (err) {
        alert("Payment Error: " + err.message);
      } finally {
        checkoutBtn.disabled = false;
        checkoutBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Proceed to Payment`;
      }
    }

    loadMenu();
  </script>
</body>
</html>
