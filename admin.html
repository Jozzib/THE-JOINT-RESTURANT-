<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - The Joint</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-8">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between bg-white p-6 rounded-3xl shadow-xs border border-slate-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-orange-500 text-white flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-utensils"></i>
        </div>
        <div>
          <h1 class="text-xl font-black text-slate-900">Menu Admin Portal</h1>
          <p class="text-xs font-semibold text-slate-500">Add, edit, or manage dishes & drinks</p>
        </div>
      </div>
      <a href="./index.html" class="text-xs font-bold text-slate-600 hover:text-orange-600 bg-slate-100 hover:bg-orange-50 px-4 py-2.5 rounded-xl transition">
        ← Back to Customer Site
      </a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- ADD NEW ITEM FORM -->
      <div class="bg-white p-6 rounded-3xl shadow-xs border border-slate-200 h-fit space-y-5">
        <h2 class="font-extrabold text-slate-900 text-lg flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-orange-500"></i> Add New Menu Item
        </h2>

        <form id="add-food-form" onsubmit="handleAddFood(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Item Name</label>
            <input type="text" id="food-name" required placeholder="e.g. Jollof Rice & Fried Fish" 
                   class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Price (₦)</label>
            <input type="number" id="food-price" required placeholder="e.g. 3500" min="0" step="50"
                   class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Category</label>
            <select id="food-category" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm bg-white font-medium focus:ring-2 focus:ring-orange-500 focus:outline-none">
              <option value="food">Food 🍲</option>
              <option value="drink">Drink 🍹</option>
            </select>
          </div>

          <!-- IMAGE FILE UPLOAD WITH PREVIEW -->
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Upload Photo</label>
            <input type="file" id="food-file" accept="image/*" onchange="previewSelectedImage(event)"
                   class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 cursor-pointer" />
          </div>

          <!-- OR IMAGE URL -->
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Or Image Web URL</label>
            <input type="url" id="food-image-url" placeholder="https://..." oninput="previewUrlImage(this.value)"
                   class="w-full px-4 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-orange-500 focus:outline-none" />
          </div>

          <!-- LIVE PREVIEW CONTAINER -->
          <div id="image-preview-container" class="hidden space-y-1">
            <span class="text-[10px] font-bold text-slate-400 uppercase">Image Preview:</span>
            <img id="image-preview" src="" class="w-full h-32 object-cover rounded-xl border border-slate-200 bg-slate-50" />
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl text-xs transition shadow-md shadow-orange-500/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Save Item to Menu
          </button>
        </form>
      </div>

      <!-- CURRENT MENU ITEMS LIST -->
      <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-xs border border-slate-200 space-y-4">
        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
          <h2 class="font-extrabold text-slate-900 text-lg">Current Items (<span id="item-count">0</span>)</h2>
          <button onclick="fetchAdminMenu()" class="text-xs font-bold text-slate-500 hover:text-slate-900 flex items-center gap-1.5">
            <i class="fa-solid fa-arrows-rotate"></i> Refresh
          </button>
        </div>

        <div id="admin-menu-list" class="space-y-3">
          <p class="text-center text-slate-400 text-sm py-10">Loading menu items...</p>
        </div>
      </div>

    </div>

  </div>

  <script>
    // SUPABASE CREDENTIALS
    const SUPABASE_URL = "https://vgznxqrcnofihvknkmfz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnem54cXJjbm9maWh2a25rbWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1NDAyODcsImV4cCI6MjEwMTExNjI4N30.xHB1roeWOuyH5L57C-hn-BDspr0X1I6HFsH_ulURWVo";

    // INITIALIZE SUPABASE CLIENT
    let supabase = null;
    if (window.supabase && SUPABASE_ANON_KEY) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } else {
      alert("⚠️ Supabase SDK failed to load. Check your internet connection or script tag.");
    }

    // PREVIEW SELECTED FILE
    function previewSelectedImage(event) {
      const file = event.target.files[0];
      const container = document.getElementById('image-preview-container');
      const img = document.getElementById('image-preview');

      if (file) {
        img.src = URL.createObjectURL(file);
        container.classList.remove('hidden');
        document.getElementById('food-image-url').value = ''; // clear URL input
      } else {
        container.classList.add('hidden');
      }
    }

    // PREVIEW IMAGE URL
    function previewUrlImage(url) {
      const container = document.getElementById('image-preview-container');
      const img = document.getElementById('image-preview');

      if (url.trim()) {
        img.src = url;
        container.classList.remove('hidden');
        document.getElementById('food-file').value = ''; // clear file input
      } else {
        container.classList.add('hidden');
      }
    }

    // LOAD MENU ITEMS
    async function fetchAdminMenu() {
      const list = document.getElementById('admin-menu-list');
      if (!supabase) {
        list.innerHTML = `<div class="p-4 bg-amber-50 text-amber-800 rounded-2xl text-xs font-bold">Supabase client not initialized</div>`;
        return;
      }

      try {
        const { data, error } = await supabase
          .from('menu_items')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        document.getElementById('item-count').innerText = data ? data.length : 0;

        if (!data || data.length === 0) {
          list.innerHTML = `<p class="text-center text-slate-400 text-xs py-10">No food items added yet.</p>`;
          return;
        }

        list.innerHTML = data.map(item => `
          <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100 gap-4">
            <div class="flex items-center gap-3 min-w-0">
              <img src="${item.image_url || 'https://via.placeholder.com/100'}" class="w-12 h-12 rounded-xl object-cover shrink-0 bg-slate-200" />
              <div class="min-w-0">
                <h4 class="font-bold text-slate-900 text-sm truncate">${item.name}</h4>
                <p class="text-xs font-extrabold text-orange-600">₦${Number(item.price).toLocaleString()} · <span class="uppercase text-[10px] text-slate-400">${item.category}</span></p>
              </div>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <button onclick="toggleAvailability(${item.id}, ${!item.is_available})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${item.is_available ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-rose-100 text-rose-700 hover:bg-rose-200'}">
                ${item.is_available ? 'Available' : 'Sold Out'}
              </button>
              <button onclick="deleteItem(${item.id})" class="p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-2xl text-xs font-bold">Error loading items: ${err.message}</div>`;
      }
    }

    // ADD FOOD WITH IMAGE UPLOAD
    async function handleAddFood(e) {
      e.preventDefault();

      if (!supabase) return alert("Supabase client is not available!");

      const btn = document.getElementById('submit-btn');
      const name = document.getElementById('food-name').value;
      const price = parseFloat(document.getElementById('food-price').value);
      const category = document.getElementById('food-category').value;
      const fileInput = document.getElementById('food-file');
      const urlInput = document.getElementById('food-image-url').value;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading & Saving...`;

      try {
        let finalImageUrl = urlInput || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80';

        // IF USER SELECTED A FILE, UPLOAD TO SUPABASE STORAGE
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;

          const { data: uploadData, error: uploadError } = await supabase.storage
            .from('menu-images')
            .upload(fileName, file);

          if (uploadError) {
            throw new Error(`Image Upload Failed: ${uploadError.message}. Make sure the public bucket 'menu-images' exists in Supabase Storage.`);
          }

          // Get Public URL
          const { data: publicUrlData } = supabase.storage
            .from('menu-images')
            .getPublicUrl(fileName);

          finalImageUrl = publicUrlData.publicUrl;
        }

        // INSERT ITEM INTO DATABASE
        const { error: dbError } = await supabase
          .from('menu_items')
          .insert([{ name, price, category, image_url: finalImageUrl, is_available: true }]);

        if (dbError) throw dbError;

        alert(`✅ "${name}" added successfully!`);
        document.getElementById('add-food-form').reset();
        document.getElementById('image-preview-container').classList.add('hidden');
        fetchAdminMenu();
      } catch (err) {
        alert(`❌ Error: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Save Item to Menu`;
      }
    }

    // TOGGLE AVAILABILITY
    async function toggleAvailability(id, is_available) {
      try {
        const { error } = await supabase
          .from('menu_items')
          .update({ is_available })
          .eq('id', id);

        if (error) throw error;
        fetchAdminMenu();
      } catch (err) {
        alert(`Error updating item: ${err.message}`);
      }
    }

    // DELETE ITEM
    async function deleteItem(id) {
      if (!confirm("Are you sure you want to delete this menu item?")) return;

      try {
        const { error } = await supabase
          .from('menu_items')
          .delete()
          .eq('id', id);

        if (error) throw error;
        fetchAdminMenu();
      } catch (err) {
        alert(`Error deleting item: ${err.message}`);
      }
    }

    // INITIAL LOAD
    document.addEventListener('DOMContentLoaded', fetchAdminMenu);
  </script>
</body>
</html>
