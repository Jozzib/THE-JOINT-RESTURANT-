<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE JOINT RESTURANT | Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <style>
      body {
        background: #f7f3e9;
      }

      .admin {
        max-width: 1120px;
        margin: auto;
        padding: 55px 30px;
      }

      .admin-top {
        display: flex;
        margin-bottom: 40px;
        align-items: center;
        justify-content: space-between;
      }

      .admin h1 {
        margin: 5px 0;
        font-family: "Playfair Display", serif;
        font-size: 48px;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: 390px 1fr;
        gap: 25px;
      }

      .admin-card {
        padding: 27px;
        border-radius: 8px;
        background: white;
      }

      .admin-card h2 {
        margin: 0 0 20px;
        font-family: "Playfair Display", serif;
        font-size: 27px;
      }

      .admin label {
        display: block;
        margin: 12px 0;
        font-size: 13px;
        font-weight: 700;
      }

      .admin input,
      .admin select,
      .admin textarea {
        width: 100%;
        margin-top: 6px;
        padding: 11px;
        border: 1px solid #e5dfd2;
        border-radius: 4px;
      }

      .admin textarea {
        height: 62px;
        resize: vertical;
      }

      .save {
        width: 100%;
        margin-top: 10px;
      }

      .manage-item,
      .order {
        padding: 14px 0;
        border-bottom: 1px solid #e5dfd2;
      }

      .manage-item {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
      }

      .manage-item h3,
      .order h3 {
        margin: 0 0 4px;
        font-size: 15px;
      }

      .manage-item p,
      .order p {
        margin: 0;
        color: #6d7269;
        font-size: 12px;
      }

      .delete {
        border: 0;
        background: none;
        color: #e85d2a;
        font-size: 12px;
        cursor: pointer;
      }

      .order-items {
        margin: 8px 0 0;
        padding-left: 17px;
        font-size: 13px;
        line-height: 1.6;
      }

      .badge {
        padding: 4px 8px;
        border-radius: 99px;
        background: #e5f0e8;
        color: #315340;
        font-size: 10px;
        font-weight: 700;
      }

      .empty-admin {
        color: #6d7269;
        font-size: 14px;
      }

      @media (max-width: 800px) {
        .admin {
          padding: 35px 20px;
        }

        .admin-grid {
          grid-template-columns: 1fr;
        }

        .admin-top {
          flex-direction: column;
          gap: 20px;
          align-items: flex-start;
        }

        .admin h1 {
          font-size: 38px;
        }
      }
    </style>
  </head>

  <body>
    <main class="admin">
      <div class="admin-top">
        <div>
          <p class="eyebrow">THE JOINT RESTURANT</p>
          <h1>Manager dashboard</h1>
          <p style="margin: 0; color: #6d7269">
            Update your menu and review orders.
          </p>
        </div>

        <a class="primary-button" href="index.html">
          View customer site <span>→</span>
        </a>
      </div>

      <div class="admin-grid">
        <section class="admin-card">
          <h2>Add a menu item</h2>

          <form id="menuForm">
            <label>
              Food name
              <input
                required
                name="name"
                placeholder="e.g. Jollof Rice & Chicken"
              />
            </label>

            <label>
              Category
              <input required name="category" placeholder="e.g. Rice" />
            </label>

            <label>
              Price (₦)
              <input
                required
                type="number"
                min="0"
                name="price"
                placeholder="4200"
              />
            </label>

            <label>
              Description
              <textarea
                required
                name="description"
                placeholder="A short description of the meal"
              ></textarea>
            </label>

            <label>
              Image link (optional)
              <input name="image" type="url" placeholder="https://..." />
            </label>

            <button class="primary-button save" type="submit">
              Add to menu <span>+</span>
            </button>
          </form>
        </section>

        <section class="admin-card">
          <h2>Available food</h2>
          <div id="menuList"></div>
        </section>

        <section class="admin-card" style="grid-column: 1 / -1">
          <h2>Recent orders</h2>
          <div id="ordersList"></div>
        </section>
      </div>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
